[www]
; Pass all environment variables from the container to PHP-FPM worker processes.
; Without this, PHP-FPM strips env vars (clear_env = yes is the default),
; which prevents Symfony from reading secrets like DROPBOX_* from the container env.
clear_env = no

; Default of 5 was hit during concurrent test streams, causing worker stalls.
pm.max_children = 20
