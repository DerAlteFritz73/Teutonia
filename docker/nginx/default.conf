server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    client_max_body_size 25M;

    index index.php;

    # Symfony front controller
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # SSE test stream: bypass buffering and extend timeout
    location = /admin/tests/stream {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 1200;
        fastcgi_buffering off;
    }

    # PHP-FPM (proxied to php container)
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # phpMyAdmin
    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
    }

    # Compiled AssetMapper assets (from shared Docker volume, not host bind mount)
    location ^~ /assets/ {
        alias /var/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache other static assets
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff2?|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
