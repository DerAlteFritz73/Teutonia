server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    client_max_body_size 25M;

    index index.php;

    # Symfony front controller
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM (proxied to php container)
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
    }

    # Compiled AssetMapper assets (from shared Docker volume, not host bind mount)
    location ^~ /assets/ {
        alias /var/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CSS/JS in public/ are NOT fingerprinted, so they must revalidate or code
    # changes never reach already-cached browsers. ETag/Last-Modified make this a
    # cheap 304 when unchanged.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Media/fonts rarely change — keep them cached long.
    location ~* \.(ico|gif|jpeg|jpg|png|woff2?|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
