services:
  php:
    build:
      context: .
      target: prod
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      APP_ENV: prod
    volumes:
      - uploads:/var/www/html/public/images/posts
      - pdfs:/var/www/html/public/pdfs
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - uploads:/var/www/html/public/images/posts:ro
      - pdfs:/var/www/html/public/pdfs:ro
    depends_on:
      - php

  database:
    image: mariadb:10.11
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      MARIADB_DATABASE: ${MARIADB_DB:-teutonia}
      MARIADB_USER: ${MARIADB_USER:-teutonia}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql

volumes:
  database_data:
  uploads:
  pdfs:
