services:
  php:
    build:
      context: .
      target: prod
    restart: unless-stopped
    container_name: teutonia-php-prod
    env_file:
      - .env.local
    environment:
      APP_ENV: prod
    volumes:
      - uploads:/var/www/html/public/images/posts
      - style_images:/var/www/html/public/images/styles
      - assets:/var/assets
      - pdfs:/var/www/html/public/pdfs
      - liederlisten:/var/www/html/public/liederlisten
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    container_name: teutonia-nginx-prod
    ports:
      - 127.0.0.1:2225:80
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - uploads:/var/www/html/public/images/posts:ro
      - style_images:/var/www/html/public/images/styles:ro
      - assets:/var/assets:ro
      - pdfs:/var/www/html/public/pdfs:ro
      - liederlisten:/var/www/html/public/liederlisten:ro
    depends_on:
      - php

  database:
    image: mariadb:10.11
    restart: unless-stopped
    container_name: teutonia-db-prod
    env_file:
      - .env.local
    environment:
      MARIADB_DATABASE: teutonia
      MARIADB_USER: teutonia
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql

volumes:
  database_data:
  uploads:
  style_images:
  assets:
  pdfs:
  liederlisten:
