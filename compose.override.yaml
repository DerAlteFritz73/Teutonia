# Development overrides — applied automatically by Docker Compose
services:
  php:
    build:
      target: dev
    environment:
      APP_ENV: dev
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor  # keep vendor from image

  nginx:
    ports:
      - "8080:80"

  database:
    ports:
      - "3306:3306"

  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
