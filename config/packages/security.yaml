security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: member_dashboard
                enable_csrf: true
            logout:
                path: app_logout
                target: app_home
            # Keep members logged in across browser closes, the session GC, and
            # deploys (which wipe the in-container session files). Signature-based
            # (no DB): a signed cookie re-authenticates silently from APP_SECRET +
            # the user's password hash, so changing a password invalidates it.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 days
                always_remember_me: true # every login is remembered (no checkbox)

    role_hierarchy:
        ROLE_GUEST: [ROLE_USER]
        ROLE_NOTENWART: [ROLE_USER]
        ROLE_ADMIN: [ROLE_USER]

    access_control:
        - { path: ^/admin/blacklist-ip-from-email, roles: PUBLIC_ACCESS }
        - { path: ^/admin/liederlisten, roles: [ROLE_ADMIN, ROLE_NOTENWART] }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/mitglieder, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
