<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sommer: Sonne über einer Notenlinie">
  <defs>
    <g id="su-note">
      <ellipse cx="0" cy="0" rx="9" ry="6.3" transform="rotate(-22)" fill="#ffffff"/>
      <rect x="6.8" y="-32" width="2.6" height="32" fill="#ffffff"/>
      <path d="M8.5 -32 C 22 -28, 24 -16, 15 -12 C 20 -20, 16 -28, 8.5 -26 Z" fill="#ffffff"/>
    </g>
  </defs>
  <!-- radiant sun, top-right corner (clear of the centred hero text) -->
  <g transform="translate(1060 74)">
    <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-84" x2="0" y2="-58"/><line x1="59" y1="-59" x2="41" y2="-41"/>
      <line x1="84" y1="0" x2="58" y2="0"/><line x1="59" y1="59" x2="41" y2="41"/>
      <line x1="0" y1="84" x2="0" y2="58"/><line x1="-59" y1="59" x2="-41" y2="41"/>
      <line x1="-84" y1="0" x2="-58" y2="0"/><line x1="-59" y1="-59" x2="-41" y2="-41"/>
    </g>
    <circle r="42" fill="#ffffff" fill-opacity="0.16"/>
    <circle r="33" fill="#fff6d8" fill-opacity="0.85"/>
  </g>
  <!-- wavy staff kept in the LOWER strip, below the subtitle -->
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5" fill="none">
    <path d="M-20 300 C 250 278, 550 330, 820 300 S 1120 272, 1220 300"/>
    <path d="M-20 320 C 250 298, 550 350, 820 320 S 1120 292, 1220 320"/>
    <path d="M-20 340 C 250 318, 550 370, 820 340 S 1120 312, 1220 340"/>
  </g>
  <!-- notes riding the lower wave -->
  <g fill="#ffffff" opacity="0.9">
    <use href="#su-note" transform="translate(230 322)"/>
    <use href="#su-note" transform="translate(400 340)"/>
    <use href="#su-note" transform="translate(600 328) rotate(180)"/>
    <use href="#su-note" transform="translate(800 340)"/>
    <use href="#su-note" transform="translate(980 322)"/>
  </g>
  <!-- reeds / grass, lower-left corner -->
  <g stroke="#ffffff" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M60 400 C 55 330, 70 300, 60 268"/>
    <path d="M95 400 C 100 340, 88 310, 100 280"/>
    <path d="M130 400 C 122 350, 138 320, 128 292"/>
  </g>
</svg>
