<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Herbst: fallende Blätter als Noten">
  <defs>
    <!-- a leaf that doubles as a note head, with a stem -->
    <g id="a-leaf">
      <path d="M0 0 C 14 -10, 14 -24, 0 -30 C -14 -24, -14 -10, 0 0 Z" fill="#ffffff"/>
      <line x1="0" y1="-2" x2="0" y2="-28" stroke="#e9c9a0" stroke-width="1.3" stroke-opacity="0.7"/>
    </g>
    <g id="a-note">
      <ellipse cx="0" cy="0" rx="9" ry="6.3" transform="rotate(-22)" fill="#ffffff"/>
      <rect x="6.8" y="-31" width="2.5" height="31" fill="#ffffff"/>
    </g>
  </defs>
  <!-- staff drifting down to the right -->
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" fill="none">
    <path d="M-20 110 C 350 140, 780 220, 1220 300"/>
    <path d="M-20 138 C 350 168, 780 248, 1220 328"/>
    <path d="M-20 166 C 350 196, 780 276, 1220 356"/>
  </g>
  <!-- bough in the top-left corner, with a couple of leaves clinging on -->
  <path d="M-30 30 C 120 52, 200 78, 250 110" fill="none"
        stroke="#ffffff" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 66 C 175 78, 190 96, 195 120" fill="none"
        stroke="#ffffff" stroke-opacity="0.36" stroke-width="2.4" stroke-linecap="round"/>
  <g opacity="0.85">
    <use href="#a-leaf" transform="translate(195 120) rotate(15) scale(1.05)"/>
    <use href="#a-leaf" transform="translate(90 58) rotate(-10)"/>
  </g>
  <!-- falling leaves/notes gathered in the lower strip, clear of the text -->
  <g opacity="0.9">
    <use href="#a-leaf" transform="translate(300 322) rotate(15) scale(1.15)"/>
    <use href="#a-note" transform="translate(430 336)"/>
    <use href="#a-leaf" transform="translate(560 316) rotate(35)"/>
    <use href="#a-note" transform="translate(700 336)"/>
    <use href="#a-leaf" transform="translate(840 318) rotate(-25) scale(1.1)"/>
    <use href="#a-note" transform="translate(980 330)"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.4">
    <use href="#a-leaf" transform="translate(640 70) rotate(45) scale(0.8)"/>
    <use href="#a-leaf" transform="translate(880 62) rotate(-30) scale(0.85)"/>
  </g>
</svg>
