<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Winter: Schneeflocken und Noten an einem kahlen Zweig">
  <defs>
    <g id="w-flake" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-14" x2="0" y2="14"/>
      <line x1="-12.1" y1="-7" x2="12.1" y2="7"/>
      <line x1="-12.1" y1="7" x2="12.1" y2="-7"/>
      <g stroke-width="1.6">
        <path d="M0 -14 l -4 4 M0 -14 l 4 4 M0 14 l -4 -4 M0 14 l 4 -4"/>
        <path d="M-12.1 -7 l 1 5.5 M12.1 7 l -1 -5.5 M-12.1 7 l 1 -5.5 M12.1 -7 l -1 5.5"/>
      </g>
    </g>
    <g id="w-note">
      <ellipse cx="0" cy="0" rx="9" ry="6.3" transform="rotate(-22)" fill="#ffffff"/>
      <rect x="6.8" y="-31" width="2.5" height="31" fill="#ffffff"/>
    </g>
  </defs>
  <!-- staff across, cool and faint -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.4" fill="none">
    <path d="M-20 150 C 300 130, 900 190, 1220 150"/>
    <path d="M-20 178 C 300 158, 900 218, 1220 178"/>
    <path d="M-20 206 C 300 186, 900 246, 1220 206"/>
  </g>
  <!-- bare branch kept low in the bottom-left corner -->
  <path d="M-30 404 C 150 356, 300 336, 540 320" fill="none"
        stroke="#ffffff" stroke-opacity="0.5" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M205 344 C 216 326, 214 314, 205 300 M356 342 C 366 324, 366 314, 356 302 M502 334 C 514 318, 514 308, 502 298"
        fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="2.2" stroke-linecap="round"/>
  <!-- notes on the branch tips (in the lower strip) -->
  <g fill="#ffffff" opacity="0.9">
    <use href="#w-note" transform="translate(205 300)"/>
    <use href="#w-note" transform="translate(356 302)"/>
    <use href="#w-note" transform="translate(502 298)"/>
  </g>
  <!-- snowflakes kept to the top corners and lower strip, clear of the text -->
  <g stroke-opacity="0.85">
    <use href="#w-flake" transform="translate(700 64) scale(1.1)"/>
    <use href="#w-flake" transform="translate(1030 96) scale(1.3)"/>
    <use href="#w-flake" transform="translate(900 322) scale(1.05)"/>
  </g>
  <g stroke-opacity="0.4">
    <use href="#w-flake" transform="translate(600 320) scale(0.85)"/>
    <use href="#w-flake" transform="translate(760 300) scale(0.9)"/>
    <use href="#w-flake" transform="translate(1080 306) scale(0.7)"/>
    <use href="#w-flake" transform="translate(560 60) scale(0.6)"/>
  </g>
</svg>
