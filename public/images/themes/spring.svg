<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Frühling: blühender Zweig mit Notenblüten">
  <defs>
    <g id="s-note">
      <ellipse cx="0" cy="0" rx="8.5" ry="6" transform="rotate(-22)" fill="#ffffff"/>
      <rect x="6.4" y="-30" width="2.4" height="30" fill="#ffffff"/>
    </g>
    <g id="s-blossom">
      <circle cx="0" cy="-9" r="7"/><circle cx="8.5" cy="-2.7" r="7"/>
      <circle cx="5.3" cy="7.3" r="7"/><circle cx="-5.3" cy="7.3" r="7"/>
      <circle cx="-8.5" cy="-2.7" r="7"/>
      <circle cx="0" cy="0" r="3.4" fill="#ffe1ea"/>
    </g>
  </defs>
  <!-- staff sweeping across, very soft -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.4" fill="none">
    <path d="M-20 120 C 300 70, 900 190, 1220 130"/>
    <path d="M-20 150 C 300 100, 900 220, 1220 160"/>
    <path d="M-20 180 C 300 130, 900 250, 1220 190"/>
  </g>
  <!-- arching branch, kept low in the bottom-left corner -->
  <path d="M-30 404 C 160 360, 300 336, 560 322" fill="none"
        stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 372 C 200 356, 230 338, 255 312" fill="none"
        stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.6" stroke-linecap="round"/>
  <g fill="#ffffff" fill-opacity="0.9">
    <use href="#s-blossom" transform="translate(255 312) scale(1.1)"/>
    <use href="#s-blossom" transform="translate(370 320)"/>
    <use href="#s-blossom" transform="translate(490 320) scale(1.15)"/>
    <use href="#s-blossom" transform="translate(180 344) scale(0.85)"/>
  </g>
  <!-- notes in the lower strip, centre-right so they stay visible inside the
       phone's centre-crop (the blossom branch occupies the lower-left) -->
  <g fill="#ffffff" opacity="0.92">
    <use href="#s-note" transform="translate(600 322)"/>
    <use href="#s-note" transform="translate(720 336)"/>
    <use href="#s-note" transform="translate(840 320)"/>
  </g>
  <!-- drifting petals, kept to the top corners -->
  <g fill="#ffffff" fill-opacity="0.5">
    <ellipse cx="640" cy="60" rx="9" ry="5" transform="rotate(30 640 60)"/>
    <ellipse cx="760" cy="78" rx="8" ry="4.5" transform="rotate(-15 760 78)"/>
    <ellipse cx="880" cy="64" rx="8" ry="4.5" transform="rotate(50 880 64)"/>
    <ellipse cx="1000" cy="86" rx="9" ry="5" transform="rotate(-40 1000 86)"/>
  </g>
</svg>
